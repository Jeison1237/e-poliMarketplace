<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - E-Poli</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<!-- Navigation -->
<nav class="navbar">
    <div class="nav-container">
        <a href="/" class="nav-logo"><i class="fas fa-store"></i> E-Poli</a>
        <div class="nav-actions">
            <a href="/products" class="nav-link"><i class="fas fa-th-large"></i> Productos</a>
            <a href="/cart" class="nav-link"><i class="fas fa-shopping-cart"></i> Carrito</a>
            <a href="/orders" class="nav-link"><i class="fas fa-box"></i> Pedidos</a>
            <a href="/profile" class="nav-link active"><i class="fas fa-user-circle"></i> Perfil</a>
            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="nav-link logout-button"><i class="fas fa-sign-out-alt"></i></button>
            </form>
        </div>
    </div>
</nav>

<div class="container" th:if="${user != null}">
    <div class="page-header">
        <h1><i class="fas fa-user-circle"></i> Mi Perfil</h1>
    </div>

    <div th:if="${success}" class="alert alert-success">
        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
    </div>

    <div class="profile-layout">
        <div class="profile-sidebar">
            <div class="profile-avatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <h3 th:text="${user.firstName + ' ' + user.lastName}">Nombre</h3>
            <p class="profile-username">@<span th:text="${user.username}">usuario</span></p>
            <span class="badge" th:text="${user.role}">BUYER</span>
            <hr>
            <nav class="profile-nav">
                <a href="/profile" class="profile-nav-link active"><i class="fas fa-user"></i> Datos Personales</a>
                <a href="/orders" class="profile-nav-link"><i class="fas fa-box"></i> Mis Pedidos</a>
                <a href="/cart" class="profile-nav-link"><i class="fas fa-shopping-cart"></i> Mi Carrito</a>
                <a href="/sellers/dashboard" class="profile-nav-link"><i class="fas fa-store"></i> Panel Vendedor</a>
            </nav>
        </div>

        <div class="profile-content">
            <div class="profile-card">
                <h2>Información Personal</h2>
                <form th:action="@{/profile}" method="post" th:object="${user}" class="profile-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre</label>
                            <input type="text" th:field="*{firstName}" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Apellido</label>
                            <input type="text" th:field="*{lastName}" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" th:value="${user.email}" class="form-control" disabled>
                        <small>El email no puede ser modificado</small>
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" th:field="*{phone}" class="form-control" placeholder="+52 555 000 0000">
                    </div>
                    <div class="form-group">
                        <label>Dirección</label>
                        <textarea th:field="*{address}" class="form-control" rows="2" placeholder="Tu dirección"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <div class="footer-bottom">
            <p>&copy; 2024 E-Poli. Todos los derechos reservados.</p>
        </div>
    </div>
</footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
