<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tienda - E-Poli</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<!-- Navigation -->
<nav class="navbar">
    <div class="nav-container">
        <a href="/" class="nav-logo"><i class="fas fa-store"></i> E-Poli</a>
        <div class="nav-actions">
            <a href="/" class="nav-link"><i class="fas fa-home"></i> Inicio</a>
            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="nav-link logout-button"><i class="fas fa-sign-out-alt"></i> Salir</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1><i class="fas fa-store"></i> Crear Mi Tienda</h1>
        <p>Llena la información de tu tienda para empezar a vender</p>
    </div>

    <div class="auth-card" style="max-width: 600px; margin: 0 auto;">
        <form th:action="@{/sellers/become-seller}" method="post" th:object="${seller}" class="auth-form" enctype="multipart/form-data">
            <div class="form-group">
                <label for="storeName"><i class="fas fa-store"></i> Nombre de la Tienda</label>
                <input type="text" id="storeName" th:field="*{storeName}" class="form-control"
                       placeholder="Ej: Mi Tienda Online" required>
            </div>
            <div class="form-group">
                <label for="description"><i class="fas fa-align-left"></i> Descripción</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="4"
                          placeholder="Describe tu tienda, qué vendes, políticas de envío..."></textarea>
            </div>
            <div class="form-group">
                <label for="logoFile"><i class="fas fa-image"></i> Logo de la Tienda (opcional)</label>
                <div class="image-upload-container">
                    <input type="file" id="logoFile" name="logoFile" class="form-control image-input"
                           accept="image/jpeg,image/png,image/gif,image/webp">
                    <small class="form-text text-muted">Formatos permitidos: JPEG, PNG, GIF, WebP (máximo 5MB)</small>
                </div>
                
                <div id="imagePreviewContainer" class="image-preview-container" style="display: none; margin-top: 15px;">
                    <p><strong>Vista previa:</strong></p>
                    <img id="imagePreview" src="" alt="Preview" style="max-width: 200px; max-height: 200px; border-radius: 5px; border: 1px solid #ddd;">
                    <button type="button" class="btn btn-sm btn-outline" onclick="clearImageUpload()" style="margin-top: 10px;">
                        <i class="fas fa-times"></i> Limpiar
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block">
                <i class="fas fa-rocket"></i> Crear Mi Tienda
            </button>
        </form>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <div class="footer-bottom">
            <p>&copy; 2024 E-Poli. Todos los derechos reservados.</p>
        </div>
    </div>
</footer>

<script th:src="@{/js/main.js}"></script>
<script>
    // Image preview functionality
    document.getElementById('logoFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            // Validate file type
            const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
            if (!allowedTypes.includes(file.type)) {
                alert('Tipo de archivo no permitido. Solo se aceptan: JPEG, PNG, GIF, WebP');
                e.target.value = '';
                document.getElementById('imagePreviewContainer').style.display = 'none';
                return;
            }
            
            // Validate file size (5MB = 5242880 bytes)
            if (file.size > 5242880) {
                alert('El archivo es muy grande. El tamaño máximo es 5MB');
                e.target.value = '';
                document.getElementById('imagePreviewContainer').style.display = 'none';
                return;
            }
            
            // Show preview
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('imagePreview').src = event.target.result;
                document.getElementById('imagePreviewContainer').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });
    
    function clearImageUpload() {
        document.getElementById('logoFile').value = '';
        document.getElementById('imagePreviewContainer').style.display = 'none';
    }
</script>
</body>
</html>
